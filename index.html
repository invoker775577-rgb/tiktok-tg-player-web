<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>⛏ Инвентарь</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="grain"></div>

<div id="app">

  <!-- Открывает шторку с библиотекой (только на телефоне) -->
  <button id="btn-library" class="btn-sm">☰ Инвентарь</button>
  <div id="sheet-backdrop" hidden></div>

  <!-- ── Боковая панель: библиотека ─────────────────────────── -->
  <aside id="sidebar">
    <header class="side-head">
      <span class="side-title">⛏ Инвентарь <b id="count">(0)</b></span>
      <button id="btn-refresh" class="btn-sm">⟳ Крафт</button>
    </header>

    <div class="side-controls">
      <select id="playlist-select">
        <option value="__all__">Весь сундук</option>
      </select>
      <button id="btn-new-playlist" class="btn-sm btn-accent">+ Сундук</button>
    </div>

    <input id="search" class="search" type="search" placeholder="Поиск блока…" autocomplete="off">

    <ul id="video-list" class="video-list"></ul>
  </aside>

  <!-- ── Основная область: плеер ────────────────────────────── -->
  <main id="stage">
    <div id="video-wrap">
      <video id="player" playsinline webkit-playsinline preload="metadata"></video>
      <div id="placeholder" class="placeholder">
        <div class="ph-title">[ ПУСТОЙ СЛОТ ]</div>
        <div class="ph-sub">выбери блок в инвентаре</div>
      </div>
      <div id="spinner" class="spinner" hidden></div>
    </div>

    <div id="controls">
      <div class="ctl-group">
        <button id="btn-prev" class="btn" title="Предыдущее">|&lt;</button>
        <button id="btn-play" class="btn btn-play" title="Play / Pause">&gt;</button>
        <button id="btn-next" class="btn" title="Следующее">&gt;|</button>
      </div>

      <div class="ctl-group">
        <button id="btn-rpt1" class="btn btn-toggle" title="Повторять одно видео">RPT 1</button>
        <button id="btn-loop" class="btn btn-toggle" title="Зациклить список">LOOP</button>
      </div>

      <div class="ctl-group vol-group">
        <span class="lbl">VOL</span>
        <input id="volume" type="range" min="0" max="100" value="70">
        <span id="vol-val" class="lbl">70%</span>
      </div>

      <div class="ctl-group now-group">
        <span id="now-playing" class="now">тишина в шахте…</span>
        <button id="btn-fullscreen" class="btn-sm" title="Развернуть на весь экран">⛶ Fullscreen</button>
        <button id="btn-add" class="btn-sm">+ Сундук</button>
      </div>
    </div>
  </main>

</div>

<!-- ── Модалка выбора плейлиста ─────────────────────────────── -->
<div id="modal" class="modal" hidden>
  <div class="modal-box">
    <div id="modal-title" class="modal-title">Положить в сундук</div>
    <div id="modal-body" class="modal-body"></div>
    <div class="modal-actions">
      <button id="modal-cancel" class="btn-sm">Закрыть</button>
    </div>
  </div>
</div>

<div id="toast" class="toast" hidden></div>

<script src="app.js"></script>
</body>
</html>
